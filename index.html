<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c16">
  <title>Sum Club — A little addition magic</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f5f7;
      --muted: #9095a8;
      --line: rgba(255, 255, 255, 0.09);
      --panel: rgba(19, 23, 39, 0.82);
      --lime: #c9fa68;
      --violet: #9b86ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 76% 16%, rgba(104, 79, 217, 0.17), transparent 31rem),
        radial-gradient(ellipse at 14% 86%, rgba(112, 166, 64, 0.1), transparent 28rem),
        #090c16;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.27) 0.65px, transparent 0.65px);
      background-size: 22px 22px;
      content: "";
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.32), transparent 78%);
      pointer-events: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: min(1080px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-size: 0.83rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-decoration: none;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(201, 250, 104, 0.38);
      border-radius: 10px;
      background: rgba(201, 250, 104, 0.1);
      color: var(--lime);
      font-size: 1.2rem;
      letter-spacing: 0;
      box-shadow: 0 0 22px rgba(201, 250, 104, 0.1);
    }

    .local-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #aeb2c1;
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .local-note::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 11px rgba(201, 250, 104, 0.85);
      content: "";
    }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(420px, 1.1fr);
      align-items: center;
      gap: clamp(42px, 8vw, 108px);
      padding: 74px 0 88px;
    }

    .intro {
      position: relative;
      padding: 20px 0;
      animation: rise-in 650ms both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 23px;
      color: var(--lime);
      font-size: 0.7rem;
      font-weight: 750;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 1px;
      background: var(--lime);
      content: "";
    }

    h1 {
      max-width: 480px;
      margin: 0;
      font-size: clamp(3.6rem, 6.6vw, 5.55rem);
      font-weight: 720;
      letter-spacing: -0.085em;
      line-height: 0.98;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(96deg, var(--lime) 5%, #d7ff9b 42%, #9bdbcf 96%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .intro-copy {
      max-width: 320px;
      margin: 25px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
    }

    .sparkle {
      position: absolute;
      top: 8%;
      right: 2%;
      width: 92px;
      height: 92px;
      border: 1px solid rgba(155, 134, 255, 0.24);
      border-radius: 28px;
      transform: rotate(18deg);
      animation: float 7s ease-in-out infinite;
    }

    .sparkle::before,
    .sparkle::after {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(155, 134, 255, 0.4);
      border-radius: 22px;
      content: "";
    }

    .sparkle::after {
      inset: 36px;
      border-color: rgba(201, 250, 104, 0.67);
      background: rgba(201, 250, 104, 0.08);
      box-shadow: 0 0 30px rgba(201, 250, 104, 0.17);
    }

    .calculator {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(25px, 4vw, 38px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(26, 30, 49, 0.95), rgba(15, 18, 31, 0.94));
      box-shadow: 0 32px 100px rgba(0, 0, 0, 0.42), inset 0 1px rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      animation: rise-in 700ms 100ms both;
    }

    .calculator::before {
      position: absolute;
      z-index: -1;
      top: -165px;
      right: -120px;
      width: 340px;
      height: 280px;
      border-radius: 50%;
      background: rgba(140, 116, 255, 0.14);
      content: "";
      filter: blur(75px);
      pointer-events: none;
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 35px;
    }

    .card-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .status {
      padding: 7px 10px;
      border: 1px solid rgba(201, 250, 104, 0.16);
      border-radius: 999px;
      background: rgba(201, 250, 104, 0.07);
      color: var(--lime);
      font-size: 0.62rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .equation {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
      align-items: end;
      gap: 13px;
    }

    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: #b5b8c7;
      font-size: 0.77rem;
      font-weight: 550;
    }

    .field-index {
      color: #70768b;
      font-size: 0.65rem;
      font-weight: 650;
      letter-spacing: 0.12em;
    }

    .field input {
      width: 100%;
      height: 63px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 13px;
      outline: none;
      background: rgba(8, 10, 19, 0.64);
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .field input:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .field input:focus {
      border-color: rgba(201, 250, 104, 0.72);
      background: rgba(9, 12, 20, 0.95);
      box-shadow: 0 0 0 4px rgba(201, 250, 104, 0.1), 0 0 24px rgba(201, 250, 104, 0.08);
    }

    .operator {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      border: 1px solid rgba(155, 134, 255, 0.28);
      border-radius: 50%;
      background: rgba(155, 134, 255, 0.1);
      color: #b8a9ff;
      font-size: 1.15rem;
      font-weight: 400;
    }

    .compute {
      position: relative;
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
      margin-top: 22px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(100deg, #d5ff7d, #b9f267);
      color: #11170b;
      cursor: pointer;
      font-size: 0.91rem;
      font-weight: 780;
      letter-spacing: 0.01em;
      box-shadow: 0 9px 25px rgba(174, 231, 94, 0.15);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .compute::after {
      position: absolute;
      top: -60%;
      left: -40%;
      width: 25%;
      height: 220%;
      background: rgba(255, 255, 255, 0.38);
      content: "";
      transform: rotate(24deg);
      transition: left 450ms ease;
    }

    .compute:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 34px rgba(174, 231, 94, 0.27);
      filter: saturate(1.1);
    }

    .compute:hover::after {
      left: 120%;
    }

    .compute:active {
      transform: translateY(0) scale(0.99);
    }

    .compute:focus-visible {
      outline: 3px solid rgba(201, 250, 104, 0.55);
      outline-offset: 4px;
    }

    .arrow {
      font-size: 1.1rem;
      line-height: 1;
      transition: transform 180ms ease;
    }

    .compute:hover .arrow {
      transform: translateX(3px);
    }

    .result-panel {
      position: relative;
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      margin-top: 15px;
      padding: 19px 20px;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 14px;
      background: rgba(7, 9, 17, 0.48);
      transition: border-color 250ms ease, background 250ms ease, box-shadow 250ms ease;
    }

    .result-panel::after {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      background: linear-gradient(transparent, var(--lime), transparent);
      content: "";
      opacity: 0.52;
    }

    .result-label {
      margin: 0 0 8px;
      color: #9298ac;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .result-value {
      min-height: 43px;
      margin: 0;
      color: #777d91;
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 650;
      letter-spacing: -0.045em;
      line-height: 1.25;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .result-value.has-result {
      color: var(--lime);
      text-shadow: 0 0 25px rgba(201, 250, 104, 0.21);
      animation: answer-in 350ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .result-panel.is-ready {
      border-color: rgba(201, 250, 104, 0.23);
      background: linear-gradient(110deg, rgba(201, 250, 104, 0.055), rgba(7, 9, 17, 0.55) 52%);
      box-shadow: inset 0 0 34px rgba(201, 250, 104, 0.025);
    }

    .card-foot {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
      color: #73798c;
      font-size: 0.68rem;
    }

    .card-foot span:last-child {
      color: #a2a6b4;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes answer-in {
      from { opacity: 0; transform: translateY(7px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: rotate(18deg) translateY(0); }
      50% { transform: rotate(28deg) translateY(-12px); }
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 38px;
        width: min(540px, 100%);
        margin: 0 auto;
        padding: 54px 0 64px;
      }

      .intro {
        padding: 0;
      }

      h1 {
        max-width: 550px;
        font-size: clamp(3.4rem, 12vw, 5rem);
      }

      .intro-copy {
        margin-top: 18px;
      }

      .sparkle {
        top: 15%;
        right: 5%;
        width: 65px;
        height: 65px;
        border-radius: 20px;
      }

      .sparkle::before { inset: 13px; border-radius: 15px; }
      .sparkle::after { inset: 26px; border-radius: 9px; }
    }

    @media (max-width: 480px) {
      .page {
        width: min(100% - 32px, 420px);
      }

      .topbar {
        min-height: 74px;
      }

      .local-note {
        font-size: 0.58rem;
      }

      .layout {
        gap: 31px;
        padding-top: 43px;
      }

      .eyebrow {
        margin-bottom: 18px;
      }

      h1 {
        font-size: clamp(3rem, 14vw, 4.1rem);
      }

      .intro-copy {
        max-width: 255px;
        font-size: 0.92rem;
      }

      .sparkle {
        top: 5%;
        right: 1%;
        width: 50px;
        height: 50px;
      }

      .sparkle::before { inset: 10px; border-radius: 12px; }
      .sparkle::after { inset: 20px; border-radius: 6px; }

      .calculator {
        padding: 23px 18px 19px;
        border-radius: 21px;
      }

      .card-heading {
        margin-bottom: 27px;
      }

      .equation {
        grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
        gap: 8px;
      }

      .field input {
        height: 57px;
        padding: 0 11px;
        font-size: 1.05rem;
      }

      .operator {
        width: 28px;
        height: 28px;
        margin-bottom: 14px;
      }

      .result-panel {
        min-height: 130px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Sum Club home">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span>SUM CLUB</span>
      </a>
      <span class="local-note">A tiny tool, just for you</span>
    </header>

    <section class="layout" aria-labelledby="page-title">
      <div class="intro">
        <div class="eyebrow">The good kind of math</div>
        <h1 id="page-title">Sum things <span>up.</span></h1>
        <p class="intro-copy">Two numbers go in. A nice, clear answer comes out. Go on, give it a try.</p>
        <div class="sparkle" aria-hidden="true"></div>
      </div>

      <section class="calculator" aria-labelledby="calculator-title">
        <div class="card-heading">
          <h2 class="card-title" id="calculator-title">Quick calculation</h2>
          <span class="status">Ready when you are</span>
        </div>

        <form id="addition-form">
          <div class="equation">
            <div class="field">
              <label for="first-number"><span>First number</span><span class="field-index">01</span></label>
              <input id="first-number" name="first-number" type="number" step="any" placeholder="0" required>
            </div>
            <span class="operator" aria-hidden="true">+</span>
            <div class="field">
              <label for="second-number"><span>Second number</span><span class="field-index">02</span></label>
              <input id="second-number" name="second-number" type="number" step="any" placeholder="0" required>
            </div>
          </div>

          <button class="compute" type="submit">
            <span>Compute</span>
            <span class="arrow" aria-hidden="true">→</span>
          </button>
        </form>

        <section class="result-panel" id="result-panel" aria-label="Calculation result">
          <p class="result-label">Your answer</p>
          <output class="result-value" id="result" aria-live="polite" aria-atomic="true">Waiting for a little math</output>
        </section>

        <div class="card-foot">
          <span>One step at a time.</span>
          <span>Made for adding ✳</span>
        </div>
      </section>
    </section>
  </main>

  <script>
    const form = document.getElementById("addition-form");
    const firstNumber = document.getElementById("first-number");
    const secondNumber = document.getElementById("second-number");
    const result = document.getElementById("result");
    const resultPanel = document.getElementById("result-panel");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const sum = firstNumber.valueAsNumber + secondNumber.valueAsNumber;
      result.textContent = new Intl.NumberFormat(undefined, {
        maximumSignificantDigits: 15
      }).format(sum);
      result.classList.remove("has-result");
      resultPanel.classList.add("is-ready");
      requestAnimationFrame(() => result.classList.add("has-result"));
    });
  </script>
</body>
</html>
